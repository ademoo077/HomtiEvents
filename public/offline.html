<!DOCTYPE html>
<html lang="fr" dir="ltr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne — حومتي ايفانت</title>
    <meta name="theme-color" content="#0F2B22">
    <link rel="icon" href="/assets/img/icon-192.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0F2B22 0%,#1A4D3E 55%,#0F2B22 100%);min-height:100vh;display:grid;place-items:center;color:#F6EFDD}
        .card{background:linear-gradient(180deg,#FFFDF6,#FAF6EC);border-radius:20px;padding:2.5rem 2rem;max-width:400px;width:90%;text-align:center;box-shadow:0 24px 56px rgba(6,20,15,.45);border:1px solid rgba(212,175,55,.5);border-top:3px solid #D4AF37}
        .icon{width:80px;height:80px;margin:0 auto 1.2rem;border-radius:50%;background:linear-gradient(135deg,#2E6E5C,#0F2B22);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(212,175,55,.3),0 8px 20px rgba(212,175,55,.3)}
        .icon svg{width:40px;height:40px}
        .wifi-off{font-size:2.5rem;color:#D4AF37}
        h1{font-size:1.3rem;font-weight:800;color:#14392E;margin-bottom:.5rem}
        p{color:#5A6B60;font-size:.9rem;margin-bottom:1.5rem;line-height:1.5}
        .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.5rem;border-radius:10px;border:none;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .2s}
        .btn-primary{background:linear-gradient(135deg,#1A4D3E,#2E6E5C);color:#fff;border:1px solid rgba(212,175,55,.6);box-shadow:0 4px 12px rgba(20,57,46,.3)}
        .btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
        .features{margin-top:1.5rem;text-align:left;font-size:.8rem;color:#5A6B60}
        .features li{margin-bottom:.3rem;padding-left:1.2rem;position:relative;list-style:none}
        .features li::before{content:'✓';position:absolute;left:0;color:#D4AF37;font-weight:700}
        .brand{margin-top:1.2rem;font-size:.75rem;color:#9AA98F}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="256" cy="256" r="230" fill="#D4AF37" opacity=".15"/>
                <g transform="translate(128,80)">
                    <rect x="60" y="220" width="136" height="160" rx="20" fill="#FFECD2"/>
                    <rect x="65" y="40" width="36" height="200" rx="18" fill="#FFECD2"/>
                    <rect x="110" y="20" width="36" height="220" rx="18" fill="#FFECD2"/>
                    <rect x="155" y="40" width="36" height="200" rx="18" fill="#FFECD2"/>
                    <rect x="200" y="70" width="32" height="170" rx="16" fill="#FFECD2"/>
                    <rect x="60" y="370" width="136" height="50" rx="10" fill="#FFD8A8"/>
                </g>
                <polygon points="256,10 261,28 280,28 265,40 271,58 256,48 241,58 247,40 232,28 251,28" fill="#D4AF37"/>
            </svg>
        </div>
        <h1>Vous êtes hors ligne</h1>
        <p>Vérifiez votre connexion Internet puis réessayez. La plateforme reste disponible dès la reconnexion.</p>
        <button class="btn btn-primary" onclick="navigator.serviceWorker.controller?navigator.serviceWorker.controller.postMessage({type:'SKIP_WAITING'}):null;location.reload()">
            <span style="font-size:1.1rem">↻</span> Réessayer
        </button>
        <ul class="features">
            <li>Vos scans QR sont sauvegardés localement</li>
            <li>La synchronisation est automatique</li>
            <li>Les données se mettent à jour à la reconnexion</li>
        </ul>
        <div class="brand">حومتي ايفانت</div>
    </div>
</body>
</html>
